<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clima Fácil</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #dff3ff, #f8fcff);
      color: #263746;
      min-height: 100vh;
      padding: 20px;
    }

    .contenedor {
      max-width: 650px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .subtitulo {
      color: #657786;
    }

    /* BUSCADOR */

    .buscador {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .buscador input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .buscador button {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      background: #4b9ed1;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    /* CLIMA ACTUAL */

    .clima-actual {
      background: white;
      border-radius: 24px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .ciudad {
      font-size: 25px;
      font-weight: bold;
    }

    .fecha {
      color: #71818c;
      margin-top: 5px;
    }

    .icono {
      font-size: 70px;
      margin: 10px;
    }

    .temperatura {
      font-size: 58px;
      font-weight: bold;
    }

    .estado {
      color: #657786;
      font-size: 18px;
      margin-bottom: 20px;
    }

    .datos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .dato {
      background: #f1f7fa;
      padding: 15px;
      border-radius: 15px;
    }

    .dato strong {
      display: block;
      font-size: 20px;
      margin-top: 5px;
    }

    /* TITULOS */

    h2 {
      margin: 25px 0 12px;
      font-size: 22px;
    }

    /* HORAS */

    .horas {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .hora {
      min-width: 90px;
      background: white;
      border-radius: 18px;
      padding: 15px 10px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .hora .emoji {
      font-size: 30px;
      margin: 8px 0;
    }

    .hora .temperatura-hora {
      font-size: 20px;
      font-weight: bold;
    }

    .lluvia {
      font-size: 13px;
      color: #4b9ed1;
      margin-top: 7px;
    }

    /* PRONÓSTICO */

    .dias {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dia {
      background: white;
      border-radius: 18px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 50px 90px;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .nombre-dia {
      font-weight: bold;
    }

    .dia-emoji {
      font-size: 28px;
      text-align: center;
    }

    .temperaturas {
      text-align: right;
    }

    .max {
      font-weight: bold;
    }

    .min {
      color: #7c8b95;
      margin-left: 5px;
    }

    /* RECOMENDACIÓN */

    .recomendacion {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
      line-height: 1.6;
    }

    /* PIE */

    footer {
      text-align: center;
      margin-top: 30px;
      color: #71818c;
      font-size: 14px;
      padding-bottom: 20px;
    }

    /* CELULAR */

    @media (max-width: 450px) {

      body {
        padding: 15px;
      }

      h1 {
        font-size: 30px;
      }

      .temperatura {
        font-size: 52px;
      }

      .dia {
        grid-template-columns: 1fr 45px 85px;
      }
    }

  </style>
</head>

<body>

    <header>
      <h1>🌤️ Clima Fácil</h1>
